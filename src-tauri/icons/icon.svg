<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="64" y="64" width="896" height="896" rx="192" ry="192" fill="url(#bg)"/>

  <!--
    "Diamond Router"
    A large diamond represents Claude's geometric identity.
    A routing arrow (1→3) cuts through the diamond,
    showing intelligent model switching at work.
  -->
  <g transform="rotate(45 512 512)">
    <!-- Outer diamond -->
    <rect x="232" y="232" width="560" height="560" rx="96" ry="96"
          fill="white"/>

    <!-- Inner hollow diamond -->
    <rect x="272" y="272" width="480" height="480" rx="80" ry="80"
          fill="url(#bg)" opacity="0.15"/>

    <!-- Router symbol: 1 input → 3 outputs -->
    <g fill="none" stroke="#D97706" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
      <!-- Input from left -->
      <line x1="296" y1="512" x2="432" y2="512"/>
      <!-- Split point -->
      <circle cx="456" cy="512" r="24" fill="#D97706" stroke="none"/>
      <!-- Three outputs to right -->
      <line x1="480" y1="512" x2="680" y2="512"/>
      <line x1="480" y1="512" x2="620" y2="392"/>
      <line x1="480" y1="512" x2="620" y2="632"/>
    </g>

    <!-- Output endpoint dots -->
    <g fill="#D97706">
      <circle cx="704" cy="512" r="18"/>
      <circle cx="636" cy="376" r="18"/>
      <circle cx="636" cy="648" r="18"/>
    </g>
  </g>
</svg>
